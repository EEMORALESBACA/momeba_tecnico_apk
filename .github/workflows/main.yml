name: Compilar APK Momeba Tecnico
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable

      - name: Dependencias
        working-directory: momeba_tecnico
        run: flutter pub get

      - name: Revisar configuracion de Firebase
        working-directory: momeba_tecnico
        run: |
          if [ ! -f android/app/google-services.json ]; then
            echo "ERROR: falta android/app/google-services.json (Firebase > Agregar app Android > com.grupomomeba.tecnico)"; exit 1
          fi

      - name: Revisar el codigo
        working-directory: momeba_tecnico
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Firma de la app (opcional)
        working-directory: momeba_tecnico
        env:
          FIRMA_B64: ${{ secrets.KEYSTORE_BASE64 }}
          FIRMA_CLAVE: ${{ secrets.KEYSTORE_PASSWORD }}
          FIRMA_CLAVE_LLAVE: ${{ secrets.KEY_PASSWORD }}
          FIRMA_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$FIRMA_B64" ]; then
            echo "$FIRMA_B64" | base64 -d > android/app/momeba-release.jks
            {
              echo "storePassword=$FIRMA_CLAVE"
              echo "keyPassword=$FIRMA_CLAVE_LLAVE"
              echo "keyAlias=$FIRMA_ALIAS"
              echo "storeFile=momeba-release.jks"
            } > android/key.properties
            echo "Firma de release instalada."
          else
            echo "Sin firma propia: se usa la firma de pruebas (sirve para instalar el APK, no para Play Store)."
          fi

      - name: Compilar APK
        working-directory: momeba_tecnico
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: momeba-tecnico-apk
          path: momeba_tecnico/build/app/outputs/flutter-apk/app-release.apk
